services:
  - type: web
    name: autoapply-backend
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install-deps && playwright install chromium"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-xxxx:6379

  - type: worker
    name: autoapply-celery
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.worker worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString

databases:
  - name: autoapply-db
    databaseName: autoapply
    user: autoapply_user
